[project]
name = "paperless-gost"
version = "0.1.0"
description = "Paperless-ngx parser for attached GOST CMS/CAdES PDF documents"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "alekseik1", email = "1alekseik1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "asn1crypto>=1.5.1",
]

[project.entry-points."paperless_ngx.parsers"]
gost_cms = "paperless_gost.parser:GOSTCMSParser"

[dependency-groups]
dev = [
    "django~=5.2.13",
    "pillow>=12.0",
    "pytest>=9.0",
    "ruff>=0.14",
    "ty>=0.0.74",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C", "B"]
ignore = ["C901", "B026", "B008"]

[tool.ruff.lint.isort]
combine-as-imports = true

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
